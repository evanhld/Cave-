<title>Cave à vins</title>

<style id="css">
:root{
  /* Layout: side nav on desktop, bottom tab bar on phone; white cards on a pale grey ground; bottle medallions; wooden shelves. Single light theme by choice. */
  --bg:#f5f5f7;--surface:#ffffff;--soft:#f0f0f3;--ink:#1c1c1e;--muted:#777783;--line:#e5e5ea;--accent:#b3263c;--accent-ink:#ffffff;
  --good:#23894d;--warn:#b86a00;--crit:#c0392b;--info:#4a6fa5;
  --c-rouge:#b3263c;--c-blanc:#e6d264;--c-rose:#f3a6b1;--c-petillant:#c5c9cf;--c-liquoreux:#e0a23a;
  --display:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body.lock{overflow:hidden}
button,a,label{-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:26px;font-weight:700}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:0;align-self:start;height:100dvh;background:var(--surface);border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--display);padding:0 10px 18px}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--accent);display:block;box-shadow:inset 0 -9px 0 rgba(0,0,0,.18)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.nav a svg{width:22px;height:22px;flex:none}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--soft);color:var(--ink);font-weight:600}
main{padding:26px 28px 56px;max-width:1100px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.save{font-size:13px;color:var(--muted);min-height:1em}
@media (max-width:860px){
  .shell{display:block}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5;gap:0}
  .brand{display:none}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;flex:1;max-width:110px}
  .nav a[aria-current="page"]{background:none;color:var(--accent)}
  main{padding:max(18px,calc(env(safe-area-inset-top) + 8px)) 16px calc(96px + env(safe-area-inset-bottom))}
}
.btn{font:500 15px var(--body);padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:#c9c9d1}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.danger{color:var(--crit)}
.btn.small{padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.tile{background:var(--soft);border-radius:12px;padding:12px 16px}
.tile span{display:block;color:var(--muted);font-size:12px;font-weight:500}
.tile b{font:600 24px var(--display);font-variant-numeric:tabular-nums}
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.count{font:500 13px var(--body);color:var(--muted)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
.hscroll .wcard{flex:0 0 164px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;cursor:pointer;min-width:0}
.wcard:hover{border-color:#c9c9d1;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.wcard.out{opacity:.5}
.wtop{display:flex;justify-content:space-between;width:100%;font:600 14px var(--display);font-variant-numeric:tabular-nums}
.wtop span:last-child{color:var(--muted);font-weight:500}
.medal{position:relative;width:92px;height:104px;margin:2px 0 6px}
.medal i{position:absolute;left:0;right:0;bottom:0;height:92px;border-radius:50%;display:block}
.medal svg{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);height:104px;width:auto}
.wprod{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.wname{font:600 14px var(--display);line-height:1.25;overflow-wrap:anywhere}
.wreg{font-size:12px;color:var(--muted);margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.peak{color:var(--good)}.pill.now{color:var(--good)}.pill.now::before{background:none;box-shadow:inset 0 0 0 2px currentColor}
.pill.soon{color:var(--warn)}.pill.early{color:var(--info)}.pill.past{color:var(--crit)}.pill.none{color:var(--muted);border-style:dashed}
.wprice{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}.up{color:var(--good)}.down{color:var(--crit)}
.tag{font:600 10px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft);border-radius:5px;padding:1px 6px;vertical-align:middle}
.stars{color:#e0a23a;letter-spacing:1px}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:#fff6e3;border-radius:12px;padding:10px 14px;margin-bottom:20px;font-size:14px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:16px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr 1fr}.filters input{grid-column:1/-1}}
input,select,textarea{font:400 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
.empty{background:var(--surface);border:1px dashed #cfcfd6;border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.bar select{width:auto;min-width:170px;font-weight:600}
/* cave */
.cave{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px 14px;overflow-x:auto}
.shelf{display:grid;grid-template-columns:34px max-content;gap:12px;align-items:center;margin-bottom:14px}
.rownum{width:34px;height:34px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font:600 14px var(--display);color:var(--muted)}
.slots{display:flex;gap:9px;padding:6px 14px 0 10px}
.plank{height:11px;margin-top:-5px;border-radius:3px;background:linear-gradient(#f4dcb1,#e3c08a);box-shadow:0 3px 0 #cda86e,0 10px 12px -8px rgba(0,0,0,.35)}
.cell{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;border:2px dashed #d6d6dd;background:none;padding:0;cursor:pointer;font:600 12px var(--display);color:#fff;flex:none}
.cell:hover{border-color:var(--ink)}
.cell.full{border:0;background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.55) 0 9%,transparent 30%),radial-gradient(circle,var(--wc) 0 55%,color-mix(in srgb,var(--wc) 72%,#000) 100%);box-shadow:5px -4px 0 color-mix(in srgb,var(--wc) 62%,#000),8px -1px 10px rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cell.full.rouge{--wc:var(--c-rouge)}.cell.full.blanc{--wc:var(--c-blanc)}.cell.full.rose{--wc:var(--c-rose)}.cell.full.petillant{--wc:var(--c-petillant)}.cell.full.liquoreux{--wc:var(--c-liquoreux)}
.cell.full.blanc,.cell.full.rose,.cell.full.petillant,.cell.full.liquoreux{color:#3a3320;text-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chips{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px}
/* journal */
.tastings{display:flex;flex-direction:column;gap:12px}
.tasting{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tasting header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.tasting p.txt{white-space:pre-wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,20,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 12px 24px;overflow-y:auto;z-index:10}
.dialog{background:var(--surface);border-radius:18px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;margin-bottom:2px}
.meta{color:var(--muted);font-size:14px}
.x{font:inherit;font-size:26px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px}
.hero{display:flex;gap:16px;align-items:center}
.hero .medal{flex:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.aging{background:var(--soft);border-radius:12px;padding:12px 14px}
.aging .track{position:relative;height:10px;border-radius:5px;display:flex;overflow:hidden;margin:10px 0 6px}
.aging .track b{display:block;height:100%}
.aging .mark{position:relative;height:0}
.aging .mark i{position:absolute;top:-22px;width:2px;height:18px;background:var(--ink);transform:translateX(-1px)}
.aging .yrs{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.aging small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.blist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;font-size:15px}
.blist li{padding:6px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form label.check{display:flex;align-items:center;gap:8px;font-size:15px}
.form label.check input{width:auto}
@media (max-width:520px){.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}}
.sugg{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.sugg button{font:500 15px var(--body);text-align:left;background:var(--soft);border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.sugg button span{color:var(--muted);font-size:13px}
.autobox{background:#eef7f0;border-radius:12px;padding:10px 14px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.autobox.off{background:var(--soft)}
.autobox b{font-weight:600}
.autobox small{color:var(--muted)}
details.more{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px}
details.more .form{margin-top:12px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick .btn{justify-content:space-between}
</style>
</head>

});

function listHtml(){
  if(!S.wines.length)return '<div class="empty"><p>Ta cave est vide.</p><button class="btn primary" data-act="add-wine">Ajouter ton premier vin</button></div>';
  var q=norm(UI.q);
  var a=S.wines.filter(function(w){
    if(UI.color&&w.color!==UI.color)return false;
    var n=qty(w);
    if(UI.stat==='out')return !n;
    if(UI.stat&&(phase(w).k!==UI.stat||!n))return false;
    if(q&&norm([w.name,w.producer,w.appellation,w.region,w.grapes,w.vintage,w.pairing].join(' ')).indexOf(q)<0)return false;
    return true;
  });
  var by={apogee:function(a,b){return ((qty(a)?0:1)-(qty(b)?0:1))||(phase(a).s-phase(b).s)||((+a.to||9999)-(+b.to||9999));},vintage:function(a,b){return (b.vintage||0)-(a.vintage||0);},rating:function(a,b){return (b.rating||0)-(a.rating||0);},name:function(a,b){return a.name.localeCompare(b.name,'fr');},price:function(a,b){return (b.price||0)-(a.price||0);}};

function setF(f,k,val,dirty){var el=f.elements[k];if(!el||val==null||val==='')return;el.value=val;if(dirty)el.dataset.dirty='1';else delete el.dataset.dirty;}
function autofill(force){
  var f=wform();if(!f)return;
  var e=dbFind(f.elements.appellation.value);
  if(e){
    var col=f.elements.color.value;
    if(!e.v[col]){col=Object.keys(e.v)[0];f.elements.color.value=col;}
    var x=e.v[col],base=num(f.elements.vintage.value)||YEAR;
    var vals={region:e.r,grapes:x.g,from:base+x.a,peak:base+x.b,to:base+x.c},changed=false;
    Object.keys(vals).forEach(function(k){var el=f.elements[k];if(force||!el.dataset.dirty){el.value=vals[k];delete el.dataset.dirty;changed=true;}});
    if(changed&&(force||!['from','peak','to'].some(function(k){return f.elements[k].dataset.dirty;})))f.elements.src.value='base';
  }
  autobox(e);
}

function aiFill(file){

  var known=['appellation','name','producer','vintage','color'].map(function(k){return f.elements[k].value?k+': '+f.elements[k].value:'';}).filter(Boolean).join('\n');
  if(!file&&!f.elements.appellation.value&&!f.elements.name.value&&!f.elements.producer.value){msg.textContent='Indique au moins l’appellation, le domaine ou la cuvée.';return;}
  var prompt='Tu es sommelier. '+(file?'Identifie le vin sur cette photo d’étiquette.':'Complète la fiche de ce vin :\n'+known)+'\nRéponds uniquement par un objet JSON avec ces clés : "name" (cuvée, ou appellation s’il n’y en a pas), "producer", "appellation", "region", "color" ("rouge", "blanc", "rose", "petillant" ou "liquoreux"), "vintage" (année ou null), "grapes" (cépages séparés par des virgules), "from" (première année de dégustation conseillée), "peak" (année de début d’apogée), "to" (dernière année conseillée), "pairing" (accords mets et vins, court), "comment" (une phrase factuelle : style, sucrosité, degré si lisible). Appuie-toi sur ce qui est lisible et sur les caractéristiques établies de l’appellation, du producteur et du millésime. Mets null quand tu ne sais pas. N’invente ni note ni récompense. Nous sommes en '+YEAR+'. Réponds en français.';
  msg.textContent=file?'Lecture de l’étiquette…':'Recherche en cours…';
  var opts={};if(file)opts.images=[file];
  sampleFn.json(prompt,opts).then(function(r){
    var f2=wform();if(!f2||!r||typeof r!=='object'){return;}
    ['appellation','producer','region','grapes','pairing','comment'].forEach(function(k){if(typeof r[k]==='string')setF(f2,k,r[k],true);});
    if(typeof r.name==='string'&&r.name!==r.appellation)setF(f2,'name',r.name,true);
    if(COLORS[r.color])f2.elements.color.value=r.color;
    if(num(r.vintage))setF(f2,'vintage',num(r.vintage),true);
    var ok=num(r.from)&&num(r.to);
    if(ok){setF(f2,'from',num(r.from),true);setF(f2,'to',num(r.to),true);setF(f2,'peak',num(r.peak)||'',true);f2.elements.src.value='claude';}
    else{['from','peak','to'].forEach(function(k){delete f2.elements[k].dataset.dirty;});autofill();}
    autobox();$('#sugg').innerHTML='';
    $('#ai-msg').textContent='Fiche remplie par Claude. Vérifie avant d’enregistrer.';
  },function(e){var m=$('#ai-msg');if(m)m.textContent=AIERR[e&&e.code]||'Claude n’a pas répondu, réessaie.';});
}
function tasteForm(wineId,remove,bottleId){
  var opts='<option value="">Pas de note</option>';
  for(var r=0.5;r<=5;r+=0.5)opts+='<option value="'+r+'">'+fmtN(r)+' / 5</option>';
  var w=wineId?wine(wineId):null;
  openModal(mhead('',w?(remove?'Ouvrir ':'Noter ')+wTitle(w):'Nouvelle dégustation','')
   +'<form class="form" data-form="taste"><input type="hidden" name="bottle" value="'+(bottleId||'')+'">'
   +(w?'<input type="hidden" name="wineId" value="'+w.id+'">':'<label class="f full">Vin<select name="wineId" required><option value="">Choisir…</option>'+S.wines.map(function(x){return '<option value="'+x.id+'">'+wTitle(x)+'</option>';}).join('')+'</select></label>')
   +'<label class="f">Date<input name="date" type="date" required value="'+today()+'"></label><label class="f">Note<select name="rating">'+opts+'</select></label>'
   +'<label class="f full">Occasion<input name="occasion" placeholder="Repas, personnes, plat…"></label>'
   +'<label class="f full">Notes de dégustation<textarea name="text" placeholder="Robe, nez, bouche, finale…"></textarea></label>'
   +'<label class="full check"><input type="checkbox" name="remove" value="1"'+(remove?' checked':'')+'> Retirer une bouteille du stock</label>'
   +'<div class="full btns"><button class="btn primary" type="submit">Enregistrer</button><button class="btn" type="button" data-act="close">Annuler</button></div></form>');
}
function valueForm(id){var w=wine(id);if(!w)return;
  openModal(mhead('','Valeur de '+wTitle(w),'Prix actuel d’une bouteille, relevé chez un caviste ou sur un site de cotes.')+'<form class="form" data-form="value"><input type="hidden" name="id" value="'+id+'"><label class="f full">Valeur actuelle (€)<input name="value" type="number" inputmode="decimal" min="0" step="0.5" required value="'+(w.value||'')+'"></label><div class="full btns"><button class="btn primary" type="submit">Enregistrer</button><button class="btn" type="button" data-act="close">Annuler</button></div></form>');
}
function placeForm(){
  openModal(mhead('','Nouveau casier','')+'<form class="form" data-form="place"><label class="f full">Nom<input name="name" required placeholder="Cave, cuisine, frigo à vin…"></label><label class="f">Étagères<input name="rows" type="number" inputmode="numeric" min="1" max="20" value="4" required></label><label class="f">Places par étagère<input name="cols" type="number" inputmode="numeric" min="1" max="20" value="6" required></label><div class="full btns"><button class="btn primary" type="submit">Créer</button><button class="btn" type="button" data-act="close">Annuler</button></div></form>');
}
function confirmBox(title,text,okAct,id){openModal(mhead('',title,'')+'<p>'+text+'</p><div class="btns"><button class="btn danger" data-act="'+okAct+'" data-id="'+id+'">Supprimer</button><button class="btn" data-act="close">Annuler</button></div>');}
function cellModal(r,c){
  var p=place(UI.place);if(!p)return;
  var b=S.bottles.find(function(x){return x.placeId===p.id&&x.r===r&&x.c===c;});
  var label='Étagère '+(r+1)+', place '+(c+1);
  if(b){
    var w=wine(b.wineId);if(!w)return;
    openModal(mhead(esc(p.name)+' · '+label,wTitle(w),esc([w.producer,w.appellation].filter(Boolean).join(' · ')))+'<div class="row">'+pill(w)+'<span>'+stars(w.rating)+'</span></div><div class="btns"><button class="btn primary" data-act="taste" data-id="'+w.id+'" data-remove="1" data-bottle="'+b.id+'">Ouvrir cette bouteille</button><button class="btn" data-act="open-wine" data-id="'+w.id+'">Voir la fiche</button><button class="btn" data-act="unplace" data-id="'+b.id+'">Sortir du casier</button></div>');
    return;
  }
  var loose={};S.bottles.forEach(function(x){if(!x.placeId)loose[x.wineId]=(loose[x.wineId]||0)+1;});
  var ids=Object.keys(loose).filter(wine);
  var h=mhead(esc(p.name),'Ranger une bouteille',label);
  if(!ids.length)h+='<p class="muted">Toutes tes bouteilles sont déjà rangées. Ajoute-en depuis la fiche d’un vin.</p>';
  else h+='<div class="pick">'+ids.map(function(id){var w=wine(id);return '<button class="btn" data-act="place" data-id="'+id+'" data-r="'+r+'" data-c="'+c+'"><span>'+dot(w.color)+wTitle(w)+'</span><span class="muted">'+loose[id]+' à ranger</span></button>';}).join('')+'</div>';
  openModal(h);
}
function exportModal(){
  openModal(mhead('','Exporter ma cave','')+'<p class="muted">Garde cette sauvegarde. Tu peux la réimporter ici ou sur un autre appareil.</p><textarea id="json-out" readonly rows="6">'+esc(JSON.stringify(S,null,2))+'</textarea><div class="btns"><button class="btn primary" data-act="dl-json">Enregistrer le fichier</button><button class="btn" data-act="copy-json">Copier</button><button class="btn" data-act="close">Fermer</button></div><p class="save" id="exp-msg"></p>');
}
function importModal(){
  openModal(mhead('','Importer une sauvegarde','')+'<p class="muted">Choisis le fichier exporté ou colle son contenu. Une sauvegarde complète remplace les données actuelles ; un fichier d’ajout de vins s’ajoute à ta cave.</p><input type="file" id="json-file" accept=".json,application/json" aria-label="Fichier de sauvegarde"><textarea id="json-in" rows="6" aria-label="Contenu de la sauvegarde"></textarea><div class="btns"><button class="btn primary" data-act="import-ok">Importer</button><button class="btn" data-act="close">Annuler</button></div><p class="save" id="exp-msg"></p>');
}

/* ---------- actions ---------- */
function takeBottle(wineId,bottleId){
  var i=-1;
  if(bottleId)i=S.bottles.findIndex(function(b){return b.id===bottleId;});
  if(i<0)i=S.bottles.findIndex(function(b){return b.wineId===wineId&&!b.placeId;});
  if(i<0)i=S.bottles.findIndex(function(b){return b.wineId===wineId;});
  if(i>=0)S.bottles.splice(i,1);
}
function act(a,el,e){
  var id=el.dataset.id;
  switch(a){
    case 'close':closeModal();break;
    case 'close-bg':if(e.target===el)closeModal();break;
    case 'add-wine':wineForm();break;
    case 'edit-wine':wineForm(id);break;
    case 'open-wine':openWine(id);break;
    case 'pick-app':{var f=wform();if(f){f.elements.appellation.value=el.dataset.name;$('#sugg').innerHTML='';autofill();}break;}
    case 'recalc':autofill(true);break;
    case 'set-value':valueForm(id);break;
    case 'ai-fill':aiFill(null);break;
    case 'add-bottle':S.bottles.push({id:uid(),wineId:id,placeId:null,r:null,c:null});commit();openWine(id);break;
    case 'taste':tasteForm(id,el.dataset.remove==='1',el.dataset.bottle||'');break;
    case 'new-taste':tasteForm('',false,'');break;
    case 'del-wine':confirmBox('Supprimer ce vin ?','« '+wTitle(wine(id))+' », ses bouteilles et ses dégustations seront supprimés.','del-wine-ok',id);break;
    case 'del-wine-ok':
      S.wines=S.wines.filter(function(x){return x.id!==id;});S.bottles=S.bottles.filter(function(b){return b.wineId!==id;});S.tastings=S.tastings.filter(function(t){return t.wineId!==id;});
      closeModal();commit();break;
    case 'del-taste':S.tastings=S.tastings.filter(function(t){return t.id!==id;});commit();break;
    case 'cell':cellModal(+el.dataset.r,+el.dataset.c);break;
    case 'place':{var b=S.bottles.find(function(x){return x.wineId===id&&!x.placeId;});if(b){b.placeId=UI.place;b.r=+el.dataset.r;b.c=+el.dataset.c;}closeModal();commit();break;}
    case 'unplace':{var u=S.bottles.find(function(x){return x.id===id;});if(u){u.placeId=null;u.r=null;u.c=null;}closeModal();commit();break;}
    case 'new-place':placeForm();break;
    case 'del-place':confirmBox('Supprimer ce casier ?','« '+esc(place(id).name)+' » sera supprimé. Ses bouteilles restent en cave, marquées « à ranger ».','del-place-ok',id);break;
    case 'del-place-ok':
      S.bottles.forEach(function(b){if(b.placeId===id){b.placeId=null;b.r=null;b.c=null;}});S.places=S.places.filter(function(x){return x.id!==id;});UI.place=null;closeModal();commit();break;
    case 'clear-demo':{
      var gone=S.wines.filter(function(w){return w.demo;}).map(function(w){return w.id;});
      S.wines=S.wines.filter(function(w){return !w.demo;});S.bottles=S.bottles.filter(function(b){return gone.indexOf(b.wineId)<0;});S.tastings=S.tastings.filter(function(t){return !t.demo&&gone.indexOf(t.wineId)<0;});
      commit();break;}
    case 'export':exportModal();break;
    case 'import':importModal();break;
    case 'copy-json':{
      var ta=$('#json-out');ta.select();
      var done=function(ok){$('#exp-msg').textContent=ok?'Copié.':'Copie impossible, sélectionne le texte à la main.';};
      try{navigator.clipboard.writeText(ta.value).then(function(){done(true);},function(){done(false);});}catch(err){done(false);}
      break;}
    case 'dl-json':{
      var json=JSON.stringify(S,null,2),say=function(t){var m=$('#exp-msg');if(m)m.textContent=t;};
      if(HOSTED){
        claude.use('downloads').then(function(d){
          if(!d){say('Téléchargement indisponible, utilise Copier.');return;}
          return d.save({filename:'ma-cave.json',data:json}).then(function(){say('Fichier enregistré.');},function(er){say(er&&er.code==='declined'?'Téléchargement annulé.':'Téléchargement impossible, utilise Copier.');});
        }).catch(function(){say('Téléchargement impossible, utilise Copier.');});
      }else{
        var blob=new Blob([json],{type:'application/json'}),file=null;
        try{file=new File([blob],'ma-cave.json',{type:'application/json'});}catch(er){}
        if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Ma cave'}).catch(function(){});}
        else{var a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='ma-cave.json';document.body.appendChild(a2);a2.click();a2.remove();}
      }
      break;}
    case 'import-ok':{
      try{
        var d2=JSON.parse($('#json-in').value);
        if(!d2||!Array.isArray(d2.wines)||!Array.isArray(d2.bottles))throw new Error('format');
        if(d2.merge){
          var have={};S.wines.forEach(function(w){have[w.id]=1;});
          var add=d2.wines.filter(function(w){return w&&w.id&&!have[w.id];}),ok={};add.forEach(function(w){ok[w.id]=1;});
          S.wines=S.wines.concat(add);
          S.bottles=S.bottles.concat(d2.bottles.filter(function(b){return ok[b.wineId];}).map(function(b){return {id:uid(),wineId:b.wineId,placeId:null,r:null,c:null};}));
          closeModal();commit();if(location.hash!=='#vins')location.hash='vins';break;
        }
        d2.places=d2.places||[];d2.tastings=d2.tastings||[];d2.v=2;
        S=d2;UI.place=null;closeModal();commit();
      }catch(er){$('#exp-msg').textContent='Ce contenu n’est pas une sauvegarde valide.';}
      break;}
  }
}
function submitForm(f){
  var d=Object.fromEntries(new FormData(f)),kind=f.dataset.form;
  if(kind==='wine'){
    var app=d.appellation.trim(),name=d.name.trim()||app;
    if(!name){f.elements.appellation.focus();return;}
    var w=d.id?wine(d.id):{id:uid()};
    var nv=num(d.value);if(nv&&nv!==+w.value){w.vhist=(w.vhist||[]).concat([{d:today(),v:nv}]);}
    Object.assign(w,{value:nv,web:(d.web||'').trim(),name:name,producer:d.producer.trim(),color:d.color,vintage:num(d.vintage),appellation:app,region:d.region.trim(),grapes:d.grapes.trim(),price:num(d.price),rating:num(d.rating)||0,from:num(d.from),peak:num(d.peak),to:num(d.to),pairing:d.pairing.trim(),comment:d.comment.trim(),src:d.src||''});
    if(!d.id){
      S.wines.push(w);
      var n=Math.max(0,Math.min(500,parseInt(d.qty,10)||0));
      for(var i=0;i<n;i++)S.bottles.push({id:uid(),wineId:w.id,placeId:null,r:null,c:null});
    }
    closeModal();commit();openWine(w.id);
  }else if(kind==='value'){
    var wv=wine(d.id),x=num(d.value);if(!wv||!x)return;
    wv.value=x;wv.vhist=(wv.vhist||[]).concat([{d:today(),v:x}]);
    closeModal();commit();openWine(wv.id);
  }else if(kind==='taste'){
    var wi=wine(d.wineId);if(!wi)return;
    var rt=num(d.rating)||0;
    S.tastings.push({id:uid(),wineId:wi.id,date:d.date,rating:rt,occasion:(d.occasion||'').trim(),text:(d.text||'').trim()});
    if(rt)wi.rating=rt;
    if(d.remove==='1')takeBottle(wi.id,d.bottle);
    closeModal();commit();
  }else if(kind==='place'){
    var p={id:uid(),name:d.name.trim(),rows:Math.max(1,Math.min(20,parseInt(d.rows,10)||1)),cols:Math.max(1,Math.min(20,parseInt(d.cols,10)||1))};
    S.places.push(p);UI.place=p.id;closeModal();commit();
    if(location.hash!=='#cave')location.hash='cave';
  }
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el,e);});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(f){e.preventDefault();submitForm(f);}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='f-q'){UI.q=t.value;$('#winelist').innerHTML=listHtml();return;}
  if(t.id==='f-app'){suggest(t.value);autofill();return;}
  if(t.id==='f-vintage'){autofill();return;}
  var f=t.form;
  if(f&&f.dataset.form==='wine'&&['region','grapes','from','peak','to'].indexOf(t.name)>=0){t.dataset.dirty='1';if(t.name!=='region'&&t.name!=='grapes')f.elements.src.value='';autobox();}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='f-color'||id==='f-stat'||id==='f-sort'){UI[id.slice(2)]=e.target.value;$('#winelist').innerHTML=listHtml();}
  else if(id==='f-wcolor'){autofill();}
  else if(id==='place-sel'){UI.place=e.target.value;render();}
  else if(id==='scan-file'){var ph=e.target.files&&e.target.files[0];if(ph)aiFill(ph);e.target.value='';}
  else if(id==='json-file'){var file=e.target.files&&e.target.files[0];if(file){var rd=new FileReader();rd.onload=function(){$('#json-in').value=String(rd.result);};rd.readAsText(file);}}
});
document.addEventListener('visibilitychange',function(){if(HOSTED&&document.hidden&&SAVE==='pending'){clearTimeout(timer);persist(true);}});
window.addEventListener('hashchange',function(){render();});
render();
if(!HOSTED&&'serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
