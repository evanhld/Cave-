<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Cave à vins</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  /* Layout: cellar-dark page; aged-paper "étiquette" cards and dialogs; wooden bottle rack. Palette: oxblood ground, brass accent, label paper. */
  --bg:#14080c;--surface:#241217;--ink:#f3e9e4;--muted:#bba3a9;--line:#4a2a33;--accent:#d4ad5c;--accent-ink:#1a0a10;--tint:#33191f;
  --good:#7fcf9f;--warn:#e8b04f;--crit:#f08a80;
  --paper:#f0e7d5;--paper-ink:#2a1a1e;--paper-muted:#6f5c5f;--paper-line:#cdbfa6;
  --c-rouge:#9b2347;--c-blanc:#d8c260;--c-rose:#e78d9f;--c-petillant:#a3c26a;--c-liquoreux:#e0922a;
  --display:'Cormorant Garamond',Georgia,serif;--body:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 520px at 85% -8%,rgba(155,35,71,.38),transparent 65%),radial-gradient(700px 480px at -5% 105%,rgba(212,173,92,.09),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%}
body.lock{overflow:hidden}
#app{max-width:1080px;margin:0 auto;padding:max(28px,calc(env(safe-area-inset-top) + 12px)) max(16px,env(safe-area-inset-right)) max(72px,calc(env(safe-area-inset-bottom) + 48px)) max(16px,env(safe-area-inset-left))}
button,a{-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:46px;letter-spacing:.01em}
h2{font-size:28px}
h3{font-size:21px}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:20px}
.brand{display:flex;align-items:center;gap:14px}
.logo{color:var(--accent);flex:none}
.sub{color:var(--muted);margin-top:6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.save{font-size:13px;color:var(--muted);min-height:1em}
.btn{font:inherit;font-weight:500;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--crit)}
.btn.small{padding:4px 12px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs a{padding:12px 18px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 70%),var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:4px;padding:14px 16px}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.tile.alert b{color:var(--warn)}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:20px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
textarea{resize:vertical;min-height:80px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
/* paper scope: label cards, journal notes, dialogs */
.card,.tasting,.dialog{--ink:var(--paper-ink);--muted:var(--paper-muted);--line:var(--paper-line);--accent:#7a1830;--accent-ink:#ffffff;--tint:#e7dcc6;--surface:#faf5e8;--good:#1f6b49;--warn:#8a5300;--crit:#a3201a;--bg:var(--paper);background:var(--paper);color:var(--ink);color-scheme:light}
.card{position:relative;display:flex;gap:12px;align-items:center;border-radius:6px;padding:20px 18px 16px 22px;cursor:pointer;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.card::after{content:"";position:absolute;inset:6px;border:1px solid rgba(42,26,30,.22);border-radius:3px;pointer-events:none}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.45)}
.card.out{opacity:.55}
.stripe{position:absolute;left:0;right:0;top:0;height:6px}
.card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.kind{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.meta{color:var(--muted);font-size:14px}
.qty{text-align:center;min-width:46px;padding-left:12px;border-left:1px solid var(--line)}
.qty b{display:block;font-family:var(--display);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.qty span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.pill.soon{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.now{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.early{color:var(--muted)}
.pill.past{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.pill.none{color:var(--muted);border-style:dashed}
.tag{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 6px;vertical-align:middle}
.stars{color:var(--accent);letter-spacing:1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:32px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
/* rangement */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.bar select{width:auto;min-width:170px}
.rack-wrap{background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 2px,transparent 2px 11px),linear-gradient(160deg,#4d2e1e,#2b160e);border:1px solid #6e4731;border-radius:10px;padding:22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 14px 34px rgba(0,0,0,.45);overflow-x:auto}
.rack{display:grid;grid-template-columns:24px repeat(var(--cols),54px);gap:10px;width:max-content;align-items:center}
.rack .lab{font-size:12px;color:#d9c0a5;text-align:center;font-variant-numeric:tabular-nums}
.cell{width:54px;height:54px;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle,#0b0406 0 56%,#1a0d08 62%,#4d2e1e 100%);box-shadow:inset 0 3px 7px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.12);color:#fff;font:600 13px var(--body)}
.cell:hover{box-shadow:inset 0 3px 7px rgba(0,0,0,.85),0 0 0 2px var(--accent)}
.cell.full{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.42),transparent 30%),radial-gradient(circle,var(--wc) 0 50%,color-mix(in srgb,var(--wc) 48%,#000) 100%);box-shadow:inset 0 0 0 6px rgba(0,0,0,.2),0 4px 9px rgba(0,0,0,.6);text-shadow:0 1px 2px rgba(0,0,0,.65)}
.cell.full:hover{box-shadow:inset 0 0 0 6px rgba(0,0,0,.2),0 0 0 2px var(--accent),0 4px 9px rgba(0,0,0,.6)}
.cell.full.rouge{--wc:var(--c-rouge)}.cell.full.blanc{--wc:var(--c-blanc)}.cell.full.rose{--wc:var(--c-rose)}.cell.full.petillant{--wc:var(--c-petillant)}.cell.full.liquoreux{--wc:var(--c-liquoreux)}
.cell.full.blanc,.cell.full.rose,.cell.full.petillant,.cell.full.liquoreux{color:#2a1f08;text-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:13px;color:#d9c0a5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.unplaced{margin-top:20px}
.unplaced ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.unplaced li{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:4px 12px;font-size:14px}
/* à boire */
.group{margin-bottom:28px}
.group h2{margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.group h2 small{font:500 13px var(--body);letter-spacing:.06em;color:var(--muted)}
.axis{position:relative;height:18px;margin:0 0 4px 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.drink-row{display:grid;grid-template-columns:minmax(150px,1.2fr) 3fr 90px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.drink-row:hover .drink-name b{color:var(--accent)}
.drink-name{display:flex;flex-direction:column;min-width:0}
.drink-name b{font-family:var(--display);font-size:20px;font-weight:600}
.drink-name span{font-size:13px;color:var(--muted)}
.track{position:relative;height:12px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;display:block}
.track .nowband{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.track .win{border-radius:6px;background:var(--muted);opacity:.9}
.track .win.now{background:var(--good)}.track .win.soon{background:var(--warn)}.track .win.past{background:var(--crit)}.track .win.early{background:var(--muted)}
.win-txt{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:620px){.drink-row{grid-template-columns:1fr 80px}.drink-row .track{grid-column:1/-1;order:3}}
/* journal */
.tastings{display:flex;flex-direction:column;gap:14px}
.tasting{border-radius:6px;padding:16px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 18px rgba(0,0,0,.3);border-left:6px solid var(--accent)}
.tasting header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.tasting p.txt{white-space:pre-wrap;font-family:var(--display);font-size:19px;line-height:1.35}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,3,6,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:10}
.dialog{border-radius:8px;width:100%;max-width:580px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);outline:1px solid rgba(42,26,30,.22);outline-offset:-8px}
.mhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;margin-bottom:4px}
.x{font:inherit;font-size:26px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:15px}
.facts dt{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding-top:3px}.facts dd{margin:0}
.blist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.blist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.form label input,.form label select,.form label textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:16px;color:var(--ink)}
.form label.check{flex-direction:row;align-items:center;gap:8px;font-weight:500;text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
.form label.check input{width:auto}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.pick{display:flex;flex-direction:column;gap:8px}
.pick .btn{text-align:left;display:flex;justify-content:space-between;gap:8px}
</style>
</head>

<script id="main">
(function(){
'use strict';
var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">';
var LOGO='<svg class="logo" viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.6 14h16.8c-.5 6-3.5 10-8.4 10s-7.9-4-8.4-10z" fill="currentColor" fill-opacity=".35" stroke="none"/><path d="M15 6h18c1.5 10-2 18-9 18S13.5 16 15 6z"/><path d="M24 24v14"/><path d="M16 42h16"/><path d="M24 38v4"/></svg>';
var KEY='cave-a-vins-v1';
var S=JSON.parse(document.getElementById('data').textContent);
try{var saved=localStorage.getItem(KEY);if(saved){var o0=JSON.parse(saved);if(o0&&Array.isArray(o0.wines)&&Array.isArray(o0.bottles))S=o0;}}catch(e){}
var YEAR=new Date().getFullYear();
var COLORS={rouge:'Rouge',blanc:'Blanc',rose:'Rosé',petillant:'Effervescent',liquoreux:'Liquoreux'};
var TABS=[['cave','Ma cave'],['rangement','Rangement'],['a-boire','À boire'],['journal','Journal']];
var UI={tab:'cave',place:null,q:'',color:'',stat:'',sort:'apogee'};
try{UI.place=sessionStorage.getItem('cave-place')||null;}catch(e){}

var art=null,timer=null;

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}

function fmtN(n){return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1});}
function fmtDate(d){try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function wine(id){return S.wines.find(function(w){return w.id===id;});}

function qty(w){return S.bottles.filter(function(b){return b.wineId===w.id;}).length;}

function status(w){
  var f=+w.from||0,t=+w.to||0;

  if(t&&YEAR>t)return {k:'past',l:'Passé',s:3};

function setSave(s){

function commit(){

}

function tabFromHash(){var h=location.hash.slice(1);return TABS.some(function(t){return t[0]===h;})?h:'cave';}
function render(){

  var html='<header class="top"><div class="brand">'+LOGO+'<div><h1>Ma cave</h1><p class="sub">'+nb+' bouteille'+(nb>1?'s':'')+' · '+S.wines.length+' référence'+(S.wines.length>1?'s':'')+'</p></div></div>'
   +'<div class="actions"><span class="save" id="save" role="status"></span><button class="btn primary" data-act="add-wine">+ Ajouter un vin</button><button class="btn" data-act="export">Exporter</button><button class="btn" data-act="import">Importer</button></div></header>'

   +'<main>'+({cave:viewCave,rangement:viewRack,'a-boire':viewDrink,journal:viewJournal}[UI.tab])()+'</main>';

function viewCave(){

  var value=S.wines.reduce(function(a,w){return a+(+w.price||0)*qty(w);},0);
  var ready=0,soon=0;
  S.wines.forEach(function(w){var n=qty(w),k=status(w).k;if(k==='now'||k==='soon')ready+=n;if(k==='soon')soon+=n;});
  var unplaced=S.bottles.filter(function(b){return !b.placeId;}).length;
  var demo=S.wines.some(function(w){return w.demo;})||S.tastings.some(function(t){return t.demo;});
  var h='<div class="tiles">'
   +'<div class="tile"><b>'+nb+'</b><span>bouteilles en cave</span></div>'
   +'<div class="tile"><b>'+fmtE.format(value)+'</b><span>valeur estimée</span></div>'
   +'<div class="tile"><b>'+ready+'</b><span>à boire maintenant</span></div>'
   +'<div class="tile'+(soon?' alert':'')+'"><b>'+soon+'</b><span>à boire avant fin '+YEAR+'</span></div>'
   +(unplaced?'<div class="tile"><b>'+unplaced+'</b><span>à ranger</span></div>':'')
   +'</div>';
  if(demo)h+='<div class="banner"><span>Les vins marqués « Exemple » montrent comment l’appli fonctionne.</span><button class="btn small" data-act="clear-demo">Supprimer les exemples</button></div>';
  h+='<div class="filters">'
   +'<input id="f-q" type="search" placeholder="Rechercher un vin, un domaine, un cépage…" aria-label="Rechercher" value="'+esc(UI.q)+'">'
   +'<select id="f-color" aria-label="Couleur"><option value="">Toutes couleurs</option>'+Object.keys(COLORS).map(function(c){return '<option value="'+c+'"'+(UI.color===c?' selected':'')+'>'+COLORS[c]+'</option>';}).join('')+'</select>'
   +'<select id="f-stat" aria-label="État">'+[['','Tous les états'],['stock','En stock'],['soon','À boire vite'],['now','À boire'],['early','En garde'],['past','Passés'],['out','Épuisés']].map(function(o){return '<option value="'+o[0]+'"'+(UI.stat===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
   +'<select id="f-sort" aria-label="Trier par">'+[['apogee','Tri : à boire d’abord'],['vintage','Tri : millésime'],['rating','Tri : note'],['name','Tri : nom'],['price','Tri : prix']].map(function(o){return '<option value="'+o[0]+'"'+(UI.sort===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
   +'</div><div id="cavelist">'+listHtml()+'</div>';
  return h;
}
function filtered(){
  var q=UI.q.trim().toLowerCase();
  var a=S.wines.filter(function(w){
    if(UI.color&&w.color!==UI.color)return false;
    var st=status(w),n=qty(w);
    if(UI.stat==='stock'&&!n)return false;
    if(UI.stat==='out'&&n)return false;
    if(['soon','now','early','past'].indexOf(UI.stat)>=0&&(st.k!==UI.stat||!n))return false;
    if(q){var hay=[w.name,w.producer,w.appellation,w.region,w.grapes,w.vintage,w.pairing].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  var by={
    apogee:function(a,b){return ((qty(a)?0:1)-(qty(b)?0:1))||(status(a).s-status(b).s)||((+a.to||9999)-(+b.to||9999));},
    vintage:function(a,b){return (b.vintage||0)-(a.vintage||0);},
    rating:function(a,b){return (b.rating||0)-(a.rating||0);},
    name:function(a,b){return a.name.localeCompare(b.name,'fr');},
    price:function(a,b){return (b.price||0)-(a.price||0);}
  };
  return a.sort(by[UI.sort]);
}
function listHtml(){
  var a=filtered();
  if(!S.wines.length)return '<div class="empty"><p>Ta cave est vide.</p><button class="btn primary" data-act="add-wine">Ajouter ton premier vin</button></div>';
  if(!a.length)return '<div class="empty"><p>Aucun vin ne correspond à ces filtres.</p></div>';
  return '<div class="list">'+a.map(function(w){
    var n=qty(w);
    return '<div class="card'+(n?'':' out')+'" role="button" tabindex="0" data-act="open-wine" data-id="'+w.id+'"><span class="stripe" style="background:'+colorVar(w.color)+'"></span>'
     +'<div class="card-main"><p class="kind">'+esc(COLORS[w.color]+(w.region?' · '+w.region:''))+'</p><h3>'+wTitle(w)+(w.demo?' <span class="tag">Exemple</span>':'')+'</h3>'
     +'<p class="meta">'+esc([w.producer,w.appellation||w.region].filter(Boolean).join(' · '))+'</p>'
     +'<div class="row">'+pill(w)+'<span>'+stars(w.rating)+'</span></div></div>'
     +'<div class="qty"><b>'+n+'</b><span>bt.</span></div></div>';
  }).join('')+'</div>';
}

function viewRack(){
  if(!S.places.length)return '<div class="empty"><p>Crée un casier pour placer tes bouteilles.</p><button class="btn primary" data-act="new-place">Créer un casier</button></div>';
  var p=place(UI.place)||S.places[0];UI.place=p.id;
  var inP=S.bottles.filter(function(b){return b.placeId===p.id;});
  var h='<div class="bar"><select id="place-sel" aria-label="Casier">'+S.places.map(function(x){return '<option value="'+x.id+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select>'
   +'<button class="btn" data-act="new-place">+ Nouveau casier</button><button class="btn danger" data-act="del-place" data-id="'+p.id+'">Supprimer ce casier</button>'
   +'<span class="muted" style="font-variant-numeric:tabular-nums">'+inP.length+' / '+(p.rows*p.cols)+' cases occupées</span></div>';
  h+='<div class="rack-wrap"><div class="rack" style="--cols:'+p.cols+'"><span></span>';
  for(var c=0;c<p.cols;c++)h+='<span class="lab">'+(c+1)+'</span>';
  for(var r=0;r<p.rows;r++){
    h+='<span class="lab">'+(r+1)+'</span>';
    for(c=0;c<p.cols;c++){
      var b=inP.find(function(x){return x.r===r&&x.c===c;});
      if(b){var w=wine(b.wineId)||{name:'?',color:'rouge'};
        h+='<button class="cell full '+w.color+'" data-act="cell" data-r="'+r+'" data-c="'+c+'" title="'+esc(w.name+(w.vintage?' '+w.vintage:''))+'" aria-label="Rangée '+(r+1)+', case '+(c+1)+' : '+esc(w.name)+'">'+(w.vintage?'’'+String(w.vintage).slice(-2):'NV')+'</button>';
      }else h+='<button class="cell" data-act="cell" data-r="'+r+'" data-c="'+c+'" aria-label="Rangée '+(r+1)+', case '+(c+1)+' : vide"></button>';
    }
  }
  h+='</div><div class="legend">'+Object.keys(COLORS).map(function(c){return '<span>'+dot(c)+COLORS[c]+'</span>';}).join('')+'<span>Chiffre : millésime</span></div></div>';
  var loose={};
  S.bottles.forEach(function(b){if(!b.placeId)loose[b.wineId]=(loose[b.wineId]||0)+1;});
  var ids=Object.keys(loose);
  if(ids.length)h+='<section class="unplaced"><h3>À ranger</h3><ul>'+ids.map(function(id){var w=wine(id);return w?'<li>'+loose[id]+' × '+wTitle(w)+'</li>':'';}).join('')+'</ul><p class="muted" style="margin-top:8px;font-size:14px">Touche une case vide pour y placer une bouteille.</p></section>';
  return h;
}

function viewDrink(){
  var items=S.wines.filter(function(w){return qty(w)>0;}).map(function(w){return {w:w,st:status(w)};});
  var dated=items.filter(function(x){return x.st.k!=='none';});
  var none=items.filter(function(x){return x.st.k==='none';});
  if(!dated.length)return '<div class="empty"><p>Renseigne la fenêtre de dégustation d’un vin pour le voir ici.</p></div>';
  var lo=YEAR-1,hi=YEAR+4;
  dated.forEach(function(x){if(+x.w.from)lo=Math.min(lo,+x.w.from);if(+x.w.to)hi=Math.max(hi,+x.w.to);});
  var span=hi+1-lo;
  function pos(y){return (y-lo)/span*100;}
  var groups=[['soon','À boire vite','dernière année de la fenêtre'],['now','À boire maintenant',''],['early','Pas encore prêts',''],['past','Fenêtre dépassée','à goûter sans attendre ou à vérifier']];
  var h='';
  groups.forEach(function(g){
    var rows=dated.filter(function(x){return x.st.k===g[0];}).sort(function(a,b){return g[0]==='early'?((+a.w.from||0)-(+b.w.from||0)):((+a.w.to||9999)-(+b.w.to||9999));});
    if(!rows.length)return;
    h+='<section class="group"><h2>'+g[1]+' <small>'+(g[2]?g[2]+' · ':'')+rows.reduce(function(a,x){return a+qty(x.w);},0)+' bt.</small></h2>';
    h+='<div class="axis" aria-hidden="true"><span style="left:0">'+lo+'</span><span style="left:'+(pos(YEAR)+100/span/2)+'%">'+YEAR+'</span><span style="left:100%">'+hi+'</span></div>';
    rows.forEach(function(x){
      var w=x.w,s=+w.from||lo,e=+w.to||hi;
      h+='<div class="drink-row" role="button" tabindex="0" data-act="open-wine" data-id="'+w.id+'"><div class="drink-name"><b>'+wTitle(w)+'</b><span>'+esc(w.producer||w.appellation||'')+' · '+qty(w)+' bt.</span></div>'
       +'<div class="track" role="img" aria-label="Fenêtre '+(w.from||'?')+' à '+(w.to||'?')+'"><i class="nowband" style="left:'+pos(YEAR)+'%;width:'+(100/span)+'%"></i><i class="win '+x.st.k+'" style="left:'+pos(s)+'%;width:'+(pos(e+1)-pos(s))+'%"></i></div>'
       +'<span class="win-txt">'+(w.from||'…')+' – '+(w.to||'…')+'</span></div>';
    });
    h+='</section>';
  });
  if(none.length)h+='<section class="group"><h2>Sans fenêtre <small>à compléter</small></h2>'+none.map(function(x){return '<div class="drink-row" role="button" tabindex="0" data-act="open-wine" data-id="'+x.w.id+'"><div class="drink-name"><b>'+wTitle(x.w)+'</b><span>'+qty(x.w)+' bt.</span></div><span></span><span class="win-txt">Modifier</span></div>';}).join('')+'</section>';
  return h;
}

function viewJournal(){
  var h='<div class="bar"><button class="btn primary" data-act="new-taste">+ Nouvelle dégustation</button></div>';
  var a=S.tastings.slice().sort(function(x,y){return y.date.localeCompare(x.date);});
  if(!a.length)return h+'<div class="empty"><p>Aucune dégustation notée pour l’instant.</p></div>';
  return h+'<div class="tastings">'+a.map(function(t){
    var w=wine(t.wineId);
    return '<article class="tasting"><header><h3>'+(w?wTitle(w):'Vin supprimé')+(t.demo?' <span class="tag">Exemple</span>':'')+'</h3><span class="muted">'+fmtDate(t.date)+'</span></header>'
     +'<div class="row">'+stars(t.rating)+(t.occasion?'<span class="muted">· '+esc(t.occasion)+'</span>':'')+'</div>'
     +(t.text?'<p class="txt">'+esc(t.text)+'</p>':'')
     +'<div><button class="btn small danger" data-act="del-taste" data-id="'+t.id+'">Supprimer</button></div></article>';
  }).join('')+'</div>';
}

function mhead(eyebrow,title,sub){

  var w=wine(id);if(!w)return;
  var bs=S.bottles.filter(function(b){return b.wineId===id;});
  var ts=S.tastings.filter(function(t){return t.wineId===id;}).sort(function(a,b){return b.date.localeCompare(a.date);});
  var h=mhead(dot(w.color)+COLORS[w.color],wTitle(w),esc([w.producer,w.appellation,w.region].filter(Boolean).join(' · ')));
  h+='<div class="row">'+pill(w)+'<span>'+stars(w.rating)+'</span></div>';
  var facts=[['Cépages',w.grapes],['Prix',w.price?fmtE.format(w.price):''],['À boire',(w.from||w.to)?(w.from||'…')+' – '+(w.to||'…'):''],['Accords',w.pairing],['Notes',w.comment]].filter(function(f){return f[1];});
  if(facts.length)h+='<dl class="facts">'+facts.map(function(f){return '<dt>'+f[0]+'</dt><dd>'+esc(f[1])+'</dd>';}).join('')+'</dl>';

  openModal(mhead('','Importer une sauvegarde','')+'<p class="muted">Colle le contenu d’un export ou choisis le fichier. Cela remplace les données actuelles.</p>'
   +'<input type="file" id="json-file" accept=".json,application/json" aria-label="Fichier de sauvegarde"><textarea id="json-in" rows="8" aria-label="Contenu de la sauvegarde"></textarea>'
   +'<div class="btns"><button class="btn primary" data-act="import-ok">Importer</button><button class="btn" data-act="close">Annuler</button></div><p class="save" id="exp-msg"></p>');
}

/* ---------- actions ---------- */
function takeBottle(wineId,bottleId){
  var i=-1;
  if(bottleId)i=S.bottles.findIndex(function(b){return b.id===bottleId;});
  if(i<0)i=S.bottles.findIndex(function(b){return b.wineId===wineId&&!b.placeId;});
  if(i<0)i=S.bottles.findIndex(function(b){return b.wineId===wineId;});
  if(i>=0)S.bottles.splice(i,1);
}
function act(a,el,e){
  var id=el.dataset.id;
  switch(a){
    case 'close':closeModal();break;
    case 'close-bg':if(e.target===el)closeModal();break;
    case 'add-wine':wineForm();break;
    case 'edit-wine':wineForm(id);break;
    case 'open-wine':openWine(id);break;
    case 'add-bottle':S.bottles.push({id:uid(),wineId:id,placeId:null,r:null,c:null});commit();openWine(id);break;
    case 'taste':tasteForm(id,el.dataset.remove==='1',el.dataset.bottle||'');break;
    case 'new-taste':tasteForm('',false,'');break;
    case 'del-wine':{var w=wine(id);confirmBox('Supprimer ce vin ?','« '+wTitle(w)+' », ses bouteilles et ses dégustations seront supprimés.','del-wine-ok',id);break;}
    case 'del-wine-ok':
      S.wines=S.wines.filter(function(x){return x.id!==id;});
      S.bottles=S.bottles.filter(function(b){return b.wineId!==id;});
      S.tastings=S.tastings.filter(function(t){return t.wineId!==id;});
      closeModal();commit();break;
    case 'del-taste':S.tastings=S.tastings.filter(function(t){return t.id!==id;});commit();break;
    case 'cell':cellModal(+el.dataset.r,+el.dataset.c);break;
    case 'place':{
      var b=S.bottles.find(function(x){return x.wineId===id&&!x.placeId;});
      if(b){b.placeId=UI.place;b.r=+el.dataset.r;b.c=+el.dataset.c;}
      closeModal();commit();break;}
    case 'unplace':{
      var u=S.bottles.find(function(x){return x.id===id;});
      if(u){u.placeId=null;u.r=null;u.c=null;}
      closeModal();commit();break;}
    case 'new-place':placeForm();break;
    case 'del-place':{var p=place(id);confirmBox('Supprimer ce casier ?','« '+esc(p.name)+' » sera supprimé. Ses bouteilles restent en cave, marquées « à ranger ».','del-place-ok',id);break;}
    case 'del-place-ok':
      S.bottles.forEach(function(b){if(b.placeId===id){b.placeId=null;b.r=null;b.c=null;}});
      S.places=S.places.filter(function(x){return x.id!==id;});
      UI.place=null;closeModal();commit();break;
    case 'clear-demo':{
      var gone=S.wines.filter(function(w){return w.demo;}).map(function(w){return w.id;});
      S.wines=S.wines.filter(function(w){return !w.demo;});
      S.bottles=S.bottles.filter(function(b){return gone.indexOf(b.wineId)<0;});
      S.tastings=S.tastings.filter(function(t){return !t.demo&&gone.indexOf(t.wineId)<0;});
      commit();break;}
    case 'export':exportModal();break;
    case 'import':importModal();break;
    case 'copy-json':{
      var ta=$('#json-out');ta.select();
      var done=function(ok){$('#exp-msg').textContent=ok?'Copié.':'Copie impossible, sélectionne le texte à la main.';};
      try{navigator.clipboard.writeText(ta.value).then(function(){done(true);},function(){done(false);});}catch(err){done(false);}
      break;}
    case 'dl-json':{
      var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      var file=null;try{file=new File([blob],'ma-cave.json',{type:'application/json'});}catch(er){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Ma cave'}).catch(function(){});}
      else{var a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='ma-cave.json';document.body.appendChild(a2);a2.click();a2.remove();}
      break;}
    case 'import-ok':{
      try{
        var d2=JSON.parse($('#json-in').value);
        if(!d2||!Array.isArray(d2.wines)||!Array.isArray(d2.bottles))throw new Error('format');
        d2.places=d2.places||[];d2.tastings=d2.tastings||[];d2.v=1;
        S=d2;UI.place=null;closeModal();commit();
      }catch(er){$('#exp-msg').textContent='Ce contenu n’est pas une sauvegarde valide.';}
      break;}
  }
}
function submitForm(f){
  var d=Object.fromEntries(new FormData(f));
  var kind=f.dataset.form;
  if(kind==='wine'){
    var w=d.id?wine(d.id):{id:uid()};
    Object.assign(w,{name:d.name.trim(),producer:d.producer.trim(),color:d.color,vintage:num(d.vintage),appellation:d.appellation.trim(),region:d.region.trim(),grapes:d.grapes.trim(),price:num(d.price),rating:num(d.rating)||0,from:num(d.from),to:num(d.to),pairing:d.pairing.trim(),comment:d.comment.trim()});
    if(!d.id){
      S.wines.push(w);
      var n=Math.max(0,Math.min(500,parseInt(d.qty,10)||0));
      for(var i=0;i<n;i++)S.bottles.push({id:uid(),wineId:w.id,placeId:null,r:null,c:null});
    }
    closeModal();commit();openWine(w.id);
  }else if(kind==='taste'){
    var wi=wine(d.wineId);if(!wi)return;
    var rt=num(d.rating)||0;
    S.tastings.push({id:uid(),wineId:wi.id,date:d.date,rating:rt,occasion:(d.occasion||'').trim(),text:(d.text||'').trim()});
    if(rt)wi.rating=rt;
    if(d.remove==='1')takeBottle(wi.id,d.bottle);
    closeModal();commit();
  }else if(kind==='place'){
    var p={id:uid(),name:d.name.trim(),rows:Math.max(1,Math.min(20,parseInt(d.rows,10)||1)),cols:Math.max(1,Math.min(20,parseInt(d.cols,10)||1))};
    S.places.push(p);UI.place=p.id;closeModal();commit();
    if(location.hash!=='#rangement')location.hash='rangement';
  }
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(el)act(el.dataset.act,el,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');
  if(f){e.preventDefault();submitForm(f);}
});
document.addEventListener('input',function(e){
  if(e.target.id==='f-q'){UI.q=e.target.value;$('#cavelist').innerHTML=listHtml();}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='f-color'||id==='f-stat'||id==='f-sort'){UI[id.slice(2)]=e.target.value;$('#cavelist').innerHTML=listHtml();}
  else if(id==='place-sel'){UI.place=e.target.value;try{sessionStorage.setItem('cave-place',UI.place);}catch(er){}render();}
  else if(id==='json-file'){
    var file=e.target.files&&e.target.files[0];
    if(file){var rd=new FileReader();rd.onload=function(){$('#json-in').value=String(rd.result);};rd.readAsText(file);}
  }
});
window.addEventListener('hashchange',function(){render();});
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
